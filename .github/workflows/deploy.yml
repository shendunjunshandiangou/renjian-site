name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # GitHub Pages 仅作为子路径预览；生产由 Cloudflare Pages 根路径托管。
        # 注入 PAGES_BASE/PAGES_SITE，使同一份源码在预览下生成 /renjian-site/ 前缀。
        env:
          PAGES_BASE: /renjian-site/
          PAGES_SITE: https://shendunjunshandiangou.github.io
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
